<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>随机井字棋</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/game-player.css">
    <script src="../assets/js/main.js" defer></script>
</head>

<body>
    <nav id="site-nav"></nav>

    <main>
        <h1>随机井字棋</h1>

        <!-- TODO: 多加一点描述 -->
        <p>这是 SM5350 (Game Design Fundamentals) 这门课的作业2！</p>

        <h3>游戏规则</h3>
        <!-- TODO: 把游戏规则写完！ -->

        <section class="game-player" aria-label="随机井字棋试玩">
            <button class="game-player__play" type="button">Play</button>
        </section>
        <script>
            const gamePlayer = document.querySelector('.game-player');
            const playButton = gamePlayer.querySelector('.game-player__play');

            playButton.addEventListener('click', () => {
                const gameFrame = document.createElement('iframe');
                gameFrame.className = 'game-player__frame';
                gameFrame.src = '../games/work2/ticktacktoe.html';
                gameFrame.title = '随机井字棋';
                gameFrame.allow = 'autoplay; fullscreen; gamepad';

                gamePlayer.replaceChildren(gameFrame);
            }, { once: true });
        </script>

    </main>

</body>
</html>
